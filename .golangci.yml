version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - gosimple
    - gosec
    - gofmt
    - goimports
    - misspell
    - revive
    - bodyclose
    - noctx

  settings:
    gosec:
      excludes:
        - G104

    revive:
      rules:
        - name: exported
          disabled: false

  exclusions:
    rules:
      - path: "_test\\.go"
        linters:
          - gosec
          - errcheck
